[pytest]
; Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

; Output and reporting
addopts = -ra --strict-markers

; Async test configuration
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

; Custom markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take longer to run

filterwarnings =
    error::DeprecationWarning:utils.*
    error::DeprecationWarning:ticketbot.*
    ignore:Use peek_ticket_number:DeprecationWarning